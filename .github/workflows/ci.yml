name: Beta qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: bash scripts/test-php.sh

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.17.0', '20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: bash scripts/test-node.sh
      - run: bash scripts/test-js.sh

  visual-check:
    name: Chromium (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npx playwright install chromium
        working-directory: mcp
      - run: node mcp/tests/visual-check-runtime.test.js
        env:
          LCFA_VISUAL_E2E: '1'

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks 8.30.1
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan Git history
        run: /tmp/gitleaks git --redact --verbose --config .gitleaks.toml .

  package:
    name: Distribution ZIP
    runs-on: ubuntu-latest
    needs: [php, node]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - run: npm ci
        working-directory: mcp
      - run: bash scripts/build-dist.sh
      - run: php tests/php/package_dist_phase1.php
      - uses: actions/upload-artifact@v7
        with:
          name: livecanvas-ai-bridge-${{ github.sha }}
          path: dist/livecanvas-forge-ai.zip
          if-no-files-found: error

name: Publish MCP beta

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @livecanvas/ai-bridge-mcp beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: mcp

      - name: Verify beta package version
        run: |
          node -e "const pkg=require('./mcp/package.json'); if (!/^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$/.test(pkg.version)) { throw new Error('Refusing to publish non-beta version: ' + pkg.version); }"

      - name: Run MCP tests
        run: bash scripts/test-node.sh

      - name: Run JavaScript tests
        run: bash scripts/test-js.sh

      - name: Publish beta to npm
        run: npm publish --access public --tag beta
        working-directory: mcp
